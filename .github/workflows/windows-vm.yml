name: Windows VM

# Runs the real hop.exe on a real Windows, in QEMU with OVMF on a Linux runner. Run it before a
# release. A green result proves nothing by itself: look at the screens. See docs/TESTING.md.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenarios from tools/vm/scenarios.py, separated by spaces'
        default: screens stuck

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      - id: key
        run: echo "key=hopvm-win11-24h2-${{ hashFiles('tools/vm/autounattend.xml', 'tools/vm/firstlogon.ps1', 'tools/vm/boot.ps1') }}" >> "$GITHUB_OUTPUT"

      - id: cached
        uses: actions/cache/restore@v6
        with:
          path: /mnt/hopvm/image
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Get ready to run a VM
        if: steps.cached.outputs.cache-hit != 'true'
        run: tools/vm/prepare-runner.sh

      - name: Download the Windows 11 Enterprise evaluation
        if: steps.cached.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 -o /mnt/hopvm/windows.iso 'https://go.microsoft.com/fwlink/?linkid=2289031&clcid=0x409&culture=en-us&country=us'

      - name: Install Windows
        if: steps.cached.outputs.cache-hit != 'true'
        timeout-minutes: 120
        run: python3 tools/vm/hopvm.py build-image --iso /mnt/hopvm/windows.iso --limit 110

      - uses: actions/cache/save@v6
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          path: /mnt/hopvm/image
          key: ${{ steps.key.outputs.key }}

      - uses: actions/upload-artifact@v7
        if: always() && steps.cached.outputs.cache-hit != 'true'
        with:
          name: image-screens
          path: /mnt/hopvm/out
          retention-days: 7

  run:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # A scenario that shrinks C: from outside Windows needs the shrink image, which a test build takes from the VM's own disk.
      - name: Build the shrink image
        if: contains(inputs.scenario, 'shrink')
        run: |
          docker run --rm -v "$PWD:/w" registry.fedoraproject.org/fedora:44 bash /w/tools/shrink/build.sh /w/shrink-out
          sudo chown -R "$(id -u):$(id -g)" shrink-out
          # A build with the published tool pinned downloads that, as a PC would. Otherwise this one, from the VM's disk.
          if grep -q "Url    = ''" engine/Shrink.ps1; then python3 tools/shrink/pin.py shrink-out 'C:\Users\hop\Downloads\hop-shrink.zip'; fi

      - name: Build hop
        run: dotnet build Hop.csproj -c Release

      - name: Get ready to run a VM
        run: tools/vm/prepare-runner.sh

      - uses: actions/cache/restore@v6
        with:
          path: /mnt/hopvm/image
          key: ${{ needs.image.outputs.key }}
          fail-on-cache-miss: true

      - name: Run the scenarios
        timeout-minutes: 110
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          cp bin/Release/hop.exe /mnt/hopvm/files/hop.exe
          if [ -f shrink-out/hop-shrink.zip ]; then cp shrink-out/hop-shrink.zip /mnt/hopvm/files/; fi
          python3 tools/vm/hopvm.py run $SCENARIO

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens
          path: /mnt/hopvm/out
          retention-days: 14
