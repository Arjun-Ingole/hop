name: Real partitions

# hop's real disk code on real partitions on virtual disks. Started by hand, before a release. See docs/TESTING.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Run the probe
        shell: powershell
        run: powershell -File tests\Probe-VirtualDisks.ps1
