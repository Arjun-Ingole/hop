name: Omarchy VM

# Installs Omarchy next to a stand-in Windows, on a disk laid out by hop's rules, in QEMU with OVMF. Runs on a push to a
# probe/omarchy branch, or by hand. Green proves nothing by itself: read report.txt and look at the screens. See docs/TESTING.md.
on:
  push:
    branches: ['probe/omarchy45-7']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Replacing Windows, which copies the live system to memory first: the ISO plus 4 GB, as hop asks.
          - name: 4.0.6-replacing-windows
            url: https://iso.omarchy.org/omarchy-4.0.6.iso
            sha: ''
            memory: 12
            encrypt: ''
            prepare: --full-disk
    steps:
      - uses: actions/checkout@v4

      - name: Get ready to run a VM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf gdisk dosfstools exfatprogs ntfs-3g btrfs-progs cryptsetup python3-pip >/dev/null
          sudo pip3 install --break-system-packages -q virt-firmware
          sudo chmod 666 /dev/kvm
          sudo mkdir -p /mnt/ovm/out
          sudo chown "$(id -u):$(id -g)" /mnt/ovm
          df -h / /mnt; nproc; free -g; pwsh -v; ls /usr/share/OVMF/

      - name: Download the ISO
        run: |
          curl -fL --retry 3 -o /mnt/ovm/omarchy.iso '${{ matrix.url }}'
          want='${{ matrix.sha }}'
          [ -n "$want" ] || want=$(curl -fsSL '${{ matrix.url }}.sha256' | cut -d' ' -f1)
          echo "$want  /mnt/ovm/omarchy.iso" | sha256sum -c - | sudo tee /mnt/ovm/out/iso-checksum.txt

      - name: Lay out the disk as hop does
        run: sudo python3 tools/vm/omarchy/omarchyvm.py prepare --iso /mnt/ovm/omarchy.iso ${{ matrix.prepare }}

      - name: Install into the free space and restart
        run: sudo python3 tools/vm/omarchy/omarchyvm.py install --memory ${{ matrix.memory }} ${{ matrix.encrypt }}

      - name: Check the disk afterwards
        if: always()
        run: sudo python3 tools/vm/omarchy/omarchyvm.py check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omarchy-${{ matrix.name }}
          path: /mnt/ovm/out
