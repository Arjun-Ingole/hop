name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'site/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'site/**', 'LICENSE']

# A newer push makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Bump these to refresh the cached PowerShell modules.
env:
  PESTER_VERSION: 5.7.1
  ANALYZER_VERSION: 1.24.0

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the engine scripts parse
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem engine, tests -Filter *.ps1) {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($problem in $errors) { Write-Output "$($file.Name):$($problem.Extent.StartLineNumber) $($problem.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - uses: actions/cache@v4
        with:
          path: ~\Documents\WindowsPowerShell\Modules\PSScriptAnalyzer
          key: analyzer-${{ env.ANALYZER_VERSION }}

      - name: Lint
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object { $_.Version -eq $env:ANALYZER_VERSION })) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -RequiredVersion $env:ANALYZER_VERSION -Scope CurrentUser -Force
          }
          $issues = Invoke-ScriptAnalyzer -Path engine -Recurse -Severity Error
          $issues | Format-Table RuleName, ScriptName, Line, Message -AutoSize -Wrap
          if ($issues) { exit 1 }

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ hashFiles('Hop.csproj') }}
          restore-keys: nuget-

      - name: Build
        run: dotnet build -c Release

      - uses: actions/cache@v4
        with:
          path: ~\Documents\WindowsPowerShell\Modules\Pester
          key: pester-${{ env.PESTER_VERSION }}

      - name: Unit tests
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq $env:PESTER_VERSION })) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - uses: actions/upload-artifact@v4
        with:
          name: hop
          path: bin/Release/hop.exe

      - name: Moving system files, on a real NTFS volume
        shell: powershell
        run: powershell -File tests\Probe-SystemFiles.ps1

      - name: GPT numbers when a partition goes
        shell: powershell
        run: powershell -File tests\Probe-GptNumbers.ps1
